name: Warren
description: 'Warren (Warren Investimentos e Gestao Patrimonial) is a Brazilian digital wealth-management
  and investment platform founded in 2017 and based in Porto Alegre. Regulated by Brazil''s Central Bank,
  the CVM securities commission, and ANBIMA, Warren offers a goals-based, fee-only model spanning managed
  portfolios, ETFs, fixed income, global stocks, gold and crypto, private pension plans, life insurance,
  currency exchange, and business (PJ) accounts, plus a Warren for Business platform for investment
  professionals. It is backed by QED Investors, Ribbit Capital, and Citi Ventures. As of this enrichment
  pass Warren exposes no public developer API, documentation portal, or first-party SDK; its GitHub
  organization (warrenbrasil) contains internal engineering tooling and courseware rather than a
  consumer-facing API surface.'
